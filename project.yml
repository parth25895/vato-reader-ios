name: VatoReader
options:
  bundleIdPrefix: com.parth25895
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  VatoReader:
    type: application
    platform: iOS
    sources:
      - path: VatoReader/Sources
      - path: VatoReader/Resources
        buildPhase: resources
      - path: VatoReader/Assets.xcassets
    scheme: {}
    info:
      path: VatoReader/Info.plist
      properties:
        CFBundleDisplayName: Vato
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - NotoSerifGujarati.ttf
          - Rasa.ttf
          - NotoSansGujarati.ttf
          - HindVadodara-Regular.ttf
          - HindVadodara-SemiBold.ttf
          - MuktaVaani-Regular.ttf
          - MuktaVaani-SemiBold.ttf
          - AnekGujarati.ttf
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parth25895.vatoreader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Manual
