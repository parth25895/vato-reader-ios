<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Vato Reader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Serif+Gujarati:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&family=Rasa:wght@400;600&family=Hind+Vadodara:wght@400;600&family=Mukta+Vaani:wght@400;600&family=Anek+Gujarati:wght@400;600&display=swap">
<style>
/* Layout: single-column mobile reader, glass bottom tab bar, content in a 680px column.
   Look: ivory and bronze by day, midnight and gold by night. Serif display type, soft cards. */
:root{
  --bg:#F6F1E7; --surface:#FFFCF6; --surface2:#EFE6D6; --ink:#1F1A14; --muted:#786C5C; --line:#E4D9C6;
  --accent:#8E5A24; --accent-ink:#FFFFFF; --gold:#B88A3E; --danger:#A8321E;
  --hl-y:#F7DE7E; --hl-g:#BFE3B4; --hl-p:#F5C3CF; --hl-b:#BFD9F2;
  --shadow:0 1px 2px rgba(60,40,15,.05),0 8px 24px rgba(60,40,15,.07);
  --hero1:#8E5A24; --hero2:#4A2E12;
  --font-read:"Noto Serif Gujarati",Georgia,serif;
  --font-ui:"Hanken Grotesk","Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Newsreader","Noto Serif Gujarati",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0E11; --surface:#17191E; --surface2:#22252C; --ink:#EDE7DB; --muted:#9B9486; --line:#2B2E36;
  --accent:#D9B46E; --accent-ink:#16120B; --gold:#D9B46E; --danger:#FF8A7A;
  --hl-y:#6B5814; --hl-g:#245636; --hl-p:#6B2C42; --hl-b:#23496E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); --hero1:#3A2A16; --hero2:#14110C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0E11; --surface:#17191E; --surface2:#22252C; --ink:#EDE7DB; --muted:#9B9486; --line:#2B2E36;
  --accent:#D9B46E; --accent-ink:#16120B; --gold:#D9B46E; --danger:#FF8A7A;
  --hl-y:#6B5814; --hl-g:#245636; --hl-p:#6B2C42; --hl-b:#23496E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); --hero1:#3A2A16; --hero2:#14110C; color-scheme:dark}
:root[data-rfont="serif"]{--font-read:"Noto Serif Gujarati",Georgia,serif}
:root[data-rfont="rasa"]{--font-read:"Rasa","Noto Serif Gujarati",Georgia,serif}
:root[data-rfont="sans"]{--font-read:"Noto Sans Gujarati",system-ui,sans-serif}
:root[data-rfont="hind"]{--font-read:"Hind Vadodara","Noto Sans Gujarati",system-ui,sans-serif}
:root[data-rfont="mukta"]{--font-read:"Mukta Vaani","Noto Sans Gujarati",system-ui,sans-serif}
:root[data-rfont="anek"]{--font-read:"Anek Gujarati","Noto Sans Gujarati",system-ui,sans-serif}
:root[data-rbg="paper"]{--bg:#F7F1E3;--surface:#FBF7EC;--surface2:#EFE6D2;--ink:#2B2620;--muted:#6B6254;--line:#E2D8C2;--accent:#7A4B1E;--accent-ink:#FFFFFF;--gold:#B0823A;--danger:#A8281E;--hl-y:#F5DE84;--hl-g:#BFDDB0;--hl-p:#F2C2C2;--hl-b:#BDD5E8;--hero1:#7A4B1E;--hero2:#3F2810;--shadow:0 1px 2px rgba(60,40,15,.05),0 8px 24px rgba(60,40,15,.07);color-scheme:light}
:root[data-rbg="sepia"]{--bg:#EFE3C8;--surface:#F5EBD4;--surface2:#E6D7B6;--ink:#3A2F22;--muted:#7A6A52;--line:#D9C9A5;--accent:#8A5A24;--accent-ink:#FFFFFF;--gold:#A77B33;--danger:#A8281E;--hl-y:#EBD27A;--hl-g:#BCD3A4;--hl-p:#E8B9B0;--hl-b:#B5CBD8;--hero1:#8A5A24;--hero2:#4A2E12;--shadow:0 1px 2px rgba(60,40,15,.05),0 8px 24px rgba(60,40,15,.08);color-scheme:light}
:root[data-rbg="grey"]{--bg:#ECEDEA;--surface:#F6F7F4;--surface2:#E2E4DF;--ink:#222426;--muted:#62666A;--line:#D6D8D3;--accent:#3E5A7A;--accent-ink:#FFFFFF;--gold:#8A7448;--danger:#B3261E;--hl-y:#FFE98A;--hl-g:#BFEBC9;--hl-p:#FFC9D6;--hl-b:#BFDDFB;--hero1:#3E5A7A;--hero2:#1E2E40;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);color-scheme:light}
:root[data-rbg="dusk"]{--bg:#2A2A2E;--surface:#333338;--surface2:#3C3C42;--ink:#DDD8CC;--muted:#A39F94;--line:#45454B;--accent:#E0B97A;--accent-ink:#2A2A2E;--gold:#E0B97A;--danger:#FF8A80;--hl-y:#6B5B12;--hl-g:#1F5A35;--hl-p:#6B2A40;--hl-b:#1F4A73;--hero1:#4A3A22;--hero2:#232026;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);color-scheme:dark}
:root[data-rbg="night"]{--bg:#0B0B0B;--surface:#161616;--surface2:#202020;--ink:#C9C4B8;--muted:#8E8A80;--line:#2A2A2A;--accent:#D9B36F;--accent-ink:#121212;--gold:#D9B36F;--danger:#FF8A80;--hl-y:#5A4D10;--hl-g:#1B4A2D;--hl-p:#5A2538;--hl-b:#1B3F61;--hero1:#2E2414;--hero2:#0E0C08;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
html{height:100%;overflow:hidden;overscroll-behavior:none}
/* The app box is pinned to the part of the frame that is really on screen (see fitViewport) */
body{position:fixed;left:0;right:0;top:var(--clip-t,0px);bottom:var(--clip-b,0px)}
.vprobe{position:fixed;left:50%;width:2px;height:50%;opacity:0;pointer-events:none;z-index:-1}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15.5px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;padding:0;-webkit-font-smoothing:antialiased}
#scroller{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:0 28px}
#app{max-width:680px;margin:0 auto}
h1,h2,h3{margin:0;line-height:1.2}
h3{font-family:var(--font-display);font-size:19px;font-weight:600}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,[role=button],.item,.swb,.nav button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.gu{font-family:var(--font-read)}

/* headers */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 14px}
.top h1{font-family:var(--font-display);font-size:32px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px}
.eyebrow,.sec{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.greet{padding:24px 2px 6px}
.greet .d{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.greet h1{font-family:var(--font-display);font-size:34px;font-weight:600;letter-spacing:-.015em;margin:4px 0 2px}
.greet .jay{font-family:var(--font-read);color:var(--gold);font-size:17px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 92%,#fff) 0%,var(--accent) 100%);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn:active,.swb:active,.nav button:active,.ib:active{opacity:.75;transform:scale(.97)}
.ib{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);font-weight:700;font-size:15px;padding:0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ib:disabled{opacity:.35}
.ib svg{width:20px;height:20px}
.ib.ck.on{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* cards and lists */
.card{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.list{display:flex;flex-direction:column;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:20px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent);cursor:pointer;min-width:0}
.item:last-child{border-bottom:0}
.item:active{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.item .n{flex:none;min-width:34px;height:34px;padding:0 7px;border-radius:999px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;font-weight:700}
.item .n.done{background:color-mix(in srgb,var(--accent) 15%,var(--surface));color:var(--accent)}
.item .n svg{width:15px;height:15px}
.item .b{min-width:0;flex:1}
.item .t{font-family:var(--font-read);font-weight:600;font-size:16.5px;line-height:1.45;overflow-wrap:anywhere}
.item .s{font-family:var(--font-read);color:var(--muted);font-size:14px;line-height:1.55;overflow-wrap:anywhere;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:12px;color:var(--muted);margin-top:4px}
.item .chev{flex:none;align-self:center;color:var(--muted);opacity:.5;font-size:20px;line-height:1}
.chip{display:inline-block;border:0;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--ink);margin:4px 4px 0 0;background:var(--surface2)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.fav{color:var(--gold);font-weight:700}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.banner{background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));border-radius:18px;padding:14px 16px;font-size:14px}
details.card>summary{cursor:pointer;font-weight:600;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";float:right;color:var(--muted)}
details.card[open]>summary::after{content:"－"}
.daily{font-family:var(--font-read);font-size:17px;line-height:1.8;margin:8px 0 0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;opacity:.9}

/* forms */
input[type=search],input[type=text],input[type=number],input[type=date],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;color:var(--ink)}
input[type=search]{border-radius:999px;padding:13px 18px;font-size:16px;box-shadow:var(--shadow);border-color:transparent}
textarea{min-height:120px;resize:vertical}
label{font-weight:600;font-size:13px;display:block;margin-bottom:5px}
.tag-edit{display:flex;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.jump{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:end}

/* home */
.hk{display:block;width:100%;text-align:left;border:0;border-radius:26px;padding:20px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--gold) 45%,transparent) 0%,transparent 55%),linear-gradient(145deg,var(--hero1),var(--hero2));
  box-shadow:0 14px 34px color-mix(in srgb,var(--hero2) 45%,transparent);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.hk .e{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;letter-spacing:.14em;font-weight:700;opacity:.8}
.hk .e b{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:16px;letter-spacing:0}
.hk .t{font-family:var(--font-read);font-size:23px;line-height:1.35;margin:12px 0 4px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hk .m{font-size:13px;opacity:.78;font-weight:500}
.hk .p{font-family:var(--font-read);font-size:15px;line-height:1.6;opacity:.85;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hk .bar{height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin-top:16px;overflow:hidden}
.hk .bar i{display:block;height:100%;background:rgba(255,255,255,.92);border-radius:9px}
.hk .f{font-size:12px;opacity:.78;margin-top:7px;font-weight:500}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini>*{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:left;min-width:0}
.mini i{font-style:normal;color:var(--gold);font-size:16px;display:block;height:20px}
.mini b{display:block;font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.mini span{font-size:12px;color:var(--muted)}
.cring{flex:none;width:38px;height:38px;position:relative;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--ink)}
.cring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.tscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.tscroll::-webkit-scrollbar{display:none}
.tcard{flex:none;width:150px;text-align:left;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.tcard b{display:block;font-family:var(--font-read);font-weight:600;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.tcard span{font-size:12px;color:var(--muted)}

/* reader */
.rbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;margin:0 -18px;padding:10px 18px 12px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.rbar .mid{flex:1;min-width:0;text-align:center;line-height:1.25}
.rbar .mid b{display:block;font-size:13px}
.rbar .mid span{font-size:12px;color:var(--muted)}
.rprog{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--accent));width:0;transition:width .15s}
.rhead{padding:18px 0 4px}
.rtitle{font-family:var(--font-read);font-size:28px;font-weight:600;line-height:1.35;margin:0;overflow-wrap:anywhere}
.rmeta{margin-top:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rmeta em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
.reader{font-family:var(--font-read);line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere;padding:14px 0 4px}
.reader mark{color:inherit;border-radius:4px;padding:1px 1px}
.m-y{background:var(--hl-y)}.m-g{background:var(--hl-g)}.m-p{background:var(--hl-p)}.m-b{background:var(--hl-b)}
mark.q{background:var(--hl-y);color:inherit;border-radius:3px}
.orn{text-align:center;color:var(--gold);font-size:20px;margin:18px 0 6px;letter-spacing:.4em}
.rtools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 14px}
.rtools .chip{margin:0;padding:7px 13px;border:1px solid var(--line);background:var(--surface)}
.rtools .chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.dock{position:sticky;bottom:10px;z-index:6;display:flex;gap:8px;align-items:center;margin-top:18px;padding:8px;border-radius:999px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);box-shadow:0 10px 30px rgba(0,0,0,.14)}
.dock .grow{flex:1;min-width:0;padding:11px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .ib{width:44px;height:44px}
.bm{display:inline-block;width:0;height:1em;position:relative;vertical-align:text-bottom}
.bm::before{content:"";position:absolute;left:-8px;top:-.1em;height:1.25em;width:4px;border-radius:2px;background:var(--accent)}

/* selection colour bar */
.selbar{position:fixed;left:0;right:0;bottom:calc(100px + var(--navlift,0px) + var(--clip-b,0px));display:flex;justify-content:center;pointer-events:none;z-index:30;padding:0 16px}
.selbar[hidden]{display:none}
.selbar>div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--bg);padding:0}
.selbar button.txt{background:none;border:0;color:var(--bg);font-weight:600;padding:2px 6px}

/* bottom tab bar: glass, icons over labels */
.nav{flex:none;position:relative;z-index:8;background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);
  border-top:1px solid color-mix(in srgb,var(--line) 80%,transparent);
  padding:4px max(8px,env(safe-area-inset-right,0px)) calc(max(10px,env(safe-area-inset-bottom,0px)) + var(--navlift,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav>div{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:6px 2px 4px;font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:23px;height:23px}
.nav button[aria-current=true]{color:var(--accent)}
.nav button[aria-current=true] .pill{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.nav .pill{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:999px;transition:background .2s}
.sitbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 auto 8px;width:min(680px,calc(100% - 32px));padding:7px 8px 7px 16px;border-radius:999px;
  background:color-mix(in srgb,var(--surface) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.sitbar::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent)}
.sitbar>div{flex:1}
.sitbar[hidden]{display:none}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px) + var(--clip-t,0px));left:50%;transform:translateX(-50%);background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:50;font-size:14px;font-weight:600;max-width:90vw;box-shadow:0 10px 28px rgba(0,0,0,.25)}

/* style picker */

  return '<div class="cring"><svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="3"/>'+(f>0?'<circle cx="19" cy="19" r="'+R+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-Math.min(1,f))).toFixed(1)+'"/>':'')+'</svg>'+label+'</div>';
}
function greetWord(){var h=new Date().getHours();return h<5?'Peaceful night':h<12?'Good morning':h<17?'Good afternoon':'Good evening'}

function row(e,global){

function runSearch(){
  var q=qText.trim(),box=$('#results');if(!box)return;
  if(!q){box.innerHTML='<div class="empty">Type to search across all '+L.entries.length.toLocaleString()+' entries.</div>';return}
  var ql=q.toLowerCase(),out=[],tot=0;
  for(var i=0;i<L.entries.length;i++){
    var e=L.entries[i],ti=e.t.toLowerCase().indexOf(ql)>-1||(e.r||'').toLowerCase().indexOf(ql)>-1,tx=e.x.toLowerCase().indexOf(ql),nt=(S.notes[e.id]||'').toLowerCase().indexOf(ql)>-1;
    var ok=qScope==='all'?(ti||tx>-1||nt):qScope==='title'?ti:qScope==='text'?tx>-1:nt;
    if(!ok)continue;tot++;if(out.length>=100)continue;
    var useNote=qScope==='notes'||(qScope==='all'&&!ti&&tx<0&&nt),src=useNote?(S.notes[e.id]||''):e.x,p=src.toLowerCase().indexOf(ql);if(p<0)p=0;
    var from0=Math.max(0,p-40),sn=(from0?'…':'')+src.slice(from0,from0+150).replace(/\s+/g,' ')+'…';
    out.push('<div class="item" data-open="'+e.id+'" role="button" tabindex="0"><div class="n">'+e.c+'.'+e.n+'</div><div class="b"><div class="t">'+hlTerms(e.t,qScope==='all'||qScope==='title'?q:'')+'</div><div class="s">'+hlTerms(sn,q)+'</div></div></div>');
  }
  box.innerHTML=tot?'<div class="sub" style="margin-bottom:6px">'+tot.toLocaleString()+' match'+(tot>1?'es':'')+(tot>100?' · showing first 100':'')+'</div><div class="list">'+out.join('')+'</div>':'<div class="empty">No matches for “'+esc(q)+'”.</div>';
}

/* ---- progress tracking ---- */
/* ---- rounds, daily log, sittings ---- */
function dayCount(k,d){var n=(S.log[k]||0)+d;if(n>0)S.log[k]=n;else delete S.log[k]}
function ensureLog(){
  if(Object.keys(S.log).length)return false;
  var c=0;Object.keys(S.read).forEach(function(id){var k=S.read[id];if(k&&k!=='earlier'){S.log[k]=(S.log[k]||0)+1;c++}});
  return c>0;
}
function markRead(id,k,quiet){
  var old=S.read[id];if(old===k)return;
  if(old&&old!=='earlier')dayCount(old,-1);
  S.read[id]=k;
  if(k!=='earlier'){dayCount(k,1);if(!S.round.start)S.round.start=k;planMark(id,k)}
  if(!quiet&&k===todayK())sitTick();
}
function unmarkRead(id){var old=S.read[id];if(!old)return;if(old!=='earlier')dayCount(old,-1);delete S.read[id]}
function roundDone(){
  var tv=0,rd=0;
  for(var i=0;i<L.entries.length;i++){var e=L.entries[i];if(isTracked(e.c)){tv++;if(S.read[e.id])rd++}}
  return tv>0&&rd===tv;
}
function afterMark(id){
  var e=byId(id);if(!e||!S.read[id]||!isTracked(e.c))return;
  var es=byCh[e.c]||[];
  if(es.every(function(x){return S.read[x.id]}))toast('Chapter '+e.c+' complete'+(roundDone()?' · Round '+S.round.n+' complete':''));
}
function finishRound(){
  var tv=0,t=todayK();L.entries.forEach(function(e){if(isTracked(e.c))tv++});
  S.hist.push({n:S.round.n,start:S.round.start||t,end:t,count:tv});
  S.round={n:S.round.n+1,start:null,target:null};S.read={};armed=null;save();
}
function finishCard(){
  return '<div class="banner"><b>Round '+S.round.n+' is complete.</b> You have read every vat you are tracking.<div class="row" style="margin-top:8px"><button class="btn pri" data-act="finish">'+(armed==='finish'?'Tap again to start Round '+(S.round.n+1):'Finish round and start Round '+(S.round.n+1))+'</button></div></div>';
}
var SIT_IDLE=20*60000;
function bucketOf(ms){var h=new Date(ms).getHours();return h>=5&&h<12?0:h>=12&&h<17?1:2}
function sitNorm(a){if(a.acc==null){a.acc=0;a.on=a.s;a.off=null}}
function sitActive(a){sitNorm(a);return a.acc+(a.on?Math.max(0,Date.now()-a.on):0)}
function sitPause(at){var a=S.sit;if(!a)return;sitNorm(a);if(a.on){var t=Math.min(at||Date.now(),Date.now());a.acc+=Math.max(0,t-a.on);a.on=null;a.off=t;rawSave();sitUi()}}
function sitResume(){var a=S.sit;if(!a||document.visibilityState==='hidden')return;sitNorm(a);if(!a.on){var now=Date.now();if(a.off)a.last+=Math.max(0,now-a.off);a.on=now;a.off=null;rawSave();sitUi()}}
function sitStart(){if(S.sit)return;var now=Date.now();S.sit={s:now,last:now,n:0,acc:0,on:now,off:null};save();sitUi()}
function sitTick(){if(!S.sit&&S.autoSit!==false)sitStart();if(S.sit){S.sit.n++;S.sit.last=Date.now()}}
function sitStop(endMs){

function selOffsets(){
  var s=window.getSelection();if(!s||!s.rangeCount||s.isCollapsed)return null;
  var r=s.getRangeAt(0),box=$('#vtext');if(!box||!box.contains(r.startContainer)||!box.contains(r.endContainer))return null;
  var pre=document.createRange();pre.selectNodeContents(box);pre.setEnd(r.startContainer,r.startOffset);
  var a=pre.toString().length,b=a+r.toString().length;return b>a?{s:a,e:b}:null;
}

/* ---- import / export ---- */
function parseText(raw){
  var out=[],sec='',blocks=raw.replace(/\r/g,'').split(/\n-{3,}\s*\n/);
  blocks.forEach(function(b){
    var lines=b.split('\n');
    while(lines.length&&!lines[0].trim())lines.shift();
    while(lines.length&&/^##\s+/.test(lines[0])){sec=lines.shift().replace(/^##\s+/,'').trim();while(lines.length&&!lines[0].trim())lines.shift()}
    if(!lines.length)return;
    var title=lines.shift().trim(),text=lines.join('\n').trim()||title;
    out.push({section:sec||'Imported',title:title,text:text});
  });
  return out;
}
function setLib(nl,resetUser){
  L=nl;build();if(resetUser){S=def();save()}
  persistLib();go('lib');
}
function doImport(replace){
  var raw=$('#imp').value.trim();if(!raw){toast('Pick a file or paste some text first');return}
  var j=null;
  if(/^[\[{]/.test(raw)){try{j=JSON.parse(raw)}catch(e){toast('That JSON could not be read');return}}
  try{
    if(j&&j.version&&j.data){applyBackup(j);return}
    if(j&&j.vato&&j.chapters){setLib(fromOriginal(j),true);toast(L.entries.length.toLocaleString()+' entries imported');return}
    if(j&&j.entries&&j.chapters&&j.topics){setLib(fromBundled(j),true);toast(L.entries.length.toLocaleString()+' entries imported');return}
    var list;
    if(j){list=(Array.isArray(j)?j:j.entries).map(function(x,i){return{section:x.section||'Imported',title:x.title||('Entry '+(i+1)),text:x.text||''}})}
    else list=parseText(raw);
    if(!list.length){toast('No entries found');return}
    var base=(!replace&&L.source!=='sample')?L:null;
    setLib(fromCustom(list,base),replace);toast(list.length+' entries imported');
  }catch(e){toast('Import failed: the file is not in a supported format')}
}
function applyBackup(j){
  var d=def();Object.keys(d).forEach(function(k){if(k in j.data)S[k]=j.data[k]});save();
  if(j.lib){L=j.lib;build();persistLib();toast('Backup restored');go('lib')}
  else{toast('Backup restored');go('lib')}
}
function loadBundled(manual){
  return fetch(BUNDLE).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
    L=fromBundled(j);build();persistLib();if(manual){toast('Loaded '+L.entries.length.toLocaleString()+' entries');go('lib')}return true;
  }).catch(function(){if(manual)toast('The built-in library could not be loaded');return false});
}

   1) IntersectionObserver against the whole screen: how much of the top and bottom halves of the page is on screen.

var relIdx=null,relCache={};
function toks(t){return String(t).split(/[\s.,;:!?()\[\]"'“”‘’\-–—।|0-9]+/).filter(function(w){return w.length>=3})}
function buildRel(){
  var post=new Map(),lens=[];
  L.entries.forEach(function(e,i){var u={};toks(e.t+' '+e.x).forEach(function(w){u[w]=1});var ks=Object.keys(u);lens.push(ks.length||1);ks.forEach(function(w){var a=post.get(w);if(!a){a=[];post.set(w,a)}a.push(i)})});
  var N=L.entries.length,idf=new Map();post.forEach(function(a,w){if(a.length>1&&a.length<N*0.06)idf.set(w,Math.log(N/a.length))});
  relIdx={post:post,idf:idf,lens:lens};
}
function related(id){
  if(relCache[id])return relCache[id];
  if(!relIdx)buildRel();
  var e=byId(id);if(!e)return [];
  var me=pos[id],sc={},u={};toks(e.t+' '+e.x).forEach(function(w){u[w]=1});
  Object.keys(u).forEach(function(w){var f=relIdx.idf.get(w);if(!f)return;relIdx.post.get(w).forEach(function(i){if(i!==me)sc[i]=(sc[i]||0)+f})});
  Object.keys(sc).forEach(function(i){sc[i]=sc[i]/Math.sqrt(relIdx.lens[i])});
  (e.tp||[]).forEach(function(t){var tt=tpMap[t];if(tt)tt.ids.forEach(function(x){var i=pos[x];if(i!==me&&i!==undefined)sc[i]=(sc[i]||0)+1.5})});
  var out=Object.keys(sc).sort(function(a,b){return sc[b]-sc[a]}).slice(0,4).map(function(i){return L.entries[i].id});

}

function localRank(words,topics){
  var ws=words.map(function(w){return String(w).trim()}).filter(function(w){return w.length>=2}),sc=[];
  var tset={};(topics||[]).forEach(function(t){var tt=tpMap[t];if(tt)tt.ids.forEach(function(x){tset[x]=1})});

  L.entries.forEach(function(e){
    var s=0;ws.forEach(function(w){if(!df[w])return;var f=Math.log(1+L.entries.length/df[w]),c=0,p=e.x.indexOf(w);while(p>-1&&c<5){c++;p=e.x.indexOf(w,p+w.length)}if(e.t.indexOf(w)>-1)c+=3;if(c)s+=f*(1+Math.log(c))});

    var ch=chMap[c];h+='<section><h2>Chapter '+c+(ch?' · '+esc(ch.gu||ch.name):'')+'</h2>';
    chs[c].forEach(function(x){
      h+='<article><h3><span>'+x.e.c+'.'+x.e.n+'</span> '+esc(x.e.t)+(x.fv?' ★':'')+'</h3>';
      x.hl.forEach(function(y){h+='<blockquote class="h-'+y.c+'">'+esc(y.t)+'</blockquote>'});
      if(x.nt)h+='<p class="note">'+esc(x.nt).replace(/\n/g,'<br>')+'</p>';
      if(x.tg.length||x.mm)h+='<p class="meta">'+(x.tg.length?'Tags: '+x.tg.map(esc).join(', '):'')+(x.mm?(x.tg.length?' · ':'')+(x.mm.m?'Memorized':'Memorizing'):'')+'</p>';
      h+='</article>';
    });
    h+='</section>';
  });
  var rk=Object.keys(S.refl||{}).sort();
  if(rk.length)h+='<section><h2>Reflections</h2>'+rk.map(function(k){return '<article><h3><span>'+esc(fmtKY(k))+'</span></h3><p class="note">'+esc(S.refl[k]).replace(/\n/g,'<br>')+'</p></article>'}).join('')+'</section>';
  return h+'<footer>જય સ્વામિનારાયણ</footer>';
}
