name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (unsigned)
        id: build
        run: |
          set +e
          xcodebuild \
            -project VatoReader.xcodeproj \
            -scheme VatoReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          STATUS=$?
          grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" build.log | grep -v "^note" | sort -u | head -200 > errors.txt
          tail -40 build.log >> errors.txt
          cat errors.txt
          exit $STATUS

      - name: Publish build log to ci-log branch
        if: always()
        run: |
          mkdir -p /tmp/ci && cp errors.txt /tmp/ci/errors.txt 2>/dev/null || echo "no errors file" > /tmp/ci/errors.txt
          echo "${{ github.sha }} ${{ steps.build.outcome }}" > /tmp/ci/status.txt
          cd /tmp/ci
          git init -q -b ci-log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "build ${{ github.sha }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry VatoReader.ipa Payload
          ls -lh VatoReader.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: VatoReader-ipa
          path: VatoReader.ipa

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest VatoReader.ipa \
            --title "Vato Reader (latest build)" \
            --notes "Built from ${{ github.sha }}. Download VatoReader.ipa and open it in AltStore → My Apps → +."
